name: Verificar Android

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    name: Pruebas y compilación
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Instalar plataforma Android
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Ejecutar pruebas y compilar APK
        working-directory: mobile
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
